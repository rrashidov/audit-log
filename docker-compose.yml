services:
  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: auditlog
      MYSQL_USER: auditlog
      MYSQL_PASSWORD: auditlog
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "auditlog", "-pauditlog"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
  app:
    build: .
    ports:
      - "8081:8080"
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: auditlog
      DB_USER: auditlog
      DB_PASSWORD: auditlog
      WARMUP_TARGET: ${WARMUP_TARGET:-1000000}
    depends_on:
      db:
        condition: service_healthy
  mysqld-exporter:
    image: prom/mysqld-exporter
    command:
      - "--config.my-cnf=/.my.cnf"
    volumes:
      - ./exporter.my.cnf:/.my.cnf:ro
    ports:
      - "9104:9104"
    depends_on:
      db:
        condition: service_healthy
  prometheus:
    image: prom/prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    depends_on:
      - mysqld-exporter
  grafana:
    image: grafana/grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
volumes:
  db_data:
  grafana-data:
