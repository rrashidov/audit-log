<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Audit Log</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" href="/">Audit Log App</a>
        <div class="navbar-nav">
            <a class="nav-link" href="/keyvalue">KeyValue</a>
            <a class="nav-link active" href="/auditlog">Audit Log</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h2>Audit Log</h2>

    <!-- Filter form -->
    <form method="get" action="/auditlog" class="row g-3 mb-4">
        <div class="col-md-4">
            <label class="form-label">Entry Type</label>
            <select name="entryType" class="form-select">
                <option value="">All Entry Types</option>
                <option th:each="et : ${entryTypes}"
                        th:value="${et}"
                        th:text="${et}"
                        th:selected="${et == selectedEntryType}">
                </option>
            </select>
        </div>
        <div class="col-md-4">
            <label class="form-label">Operation Type</label>
            <select name="operationType" class="form-select">
                <option value="">All Operation Types</option>
                <option th:each="ot : ${operationTypes}"
                        th:value="${ot}"
                        th:text="${ot}"
                        th:selected="${ot == selectedOperationType}">
                </option>
            </select>
        </div>
        <div class="col-md-4 d-flex align-items-end gap-2">
            <button type="submit" class="btn btn-primary">Filter</button>
            <a href="/auditlog" class="btn btn-secondary">Reset</a>
        </div>
    </form>

    <p class="text-muted">Total: <span th:text="${auditLogs.totalElements}">0</span> records</p>

    <table class="table table-striped table-hover">
        <thead class="table-dark">
        <tr>
            <th>ID</th>
            <th>Entry Type</th>
            <th>Operation Type</th>
            <th>Date/Time (UTC)</th>
            <th>Count</th>
            <th>Duration (ms)</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="log : ${auditLogs.content}">
            <td th:text="${log.id}" class="text-truncate" style="max-width: 200px;"></td>
            <td>
                <span class="badge"
                      th:classappend="${log.entryType.name() == 'REGULAR'} ? 'bg-success' : 'bg-info text-dark'"
                      th:text="${log.entryType}">
                </span>
            </td>
            <td>
                <span class="badge"
                      th:classappend="${log.operationType.name() == 'CREATE'} ? 'bg-success' :
                                      (${log.operationType.name() == 'READ'} ? 'bg-primary' :
                                      (${log.operationType.name() == 'UPDATE'} ? 'bg-warning text-dark' : 'bg-danger'))"
                      th:text="${log.operationType}">
                </span>
            </td>
            <td th:text="${#temporals.format(log.dateTime, 'yyyy-MM-dd HH:mm:ss')}"></td>
            <td th:text="${log.count}"></td>
            <td th:text="${log.duration}"></td>
        </tr>
        <tr th:if="${auditLogs.content.empty}">
            <td colspan="6" class="text-center text-muted">No records found</td>
        </tr>
        </tbody>
    </table>

    <!-- Pagination -->
    <nav th:if="${auditLogs.totalPages > 1}">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/auditlog(page=${currentPage - 1}, entryType=${selectedEntryType}, operationType=${selectedOperationType})}">
                    Previous
                </a>
            </li>
            <li class="page-item disabled">
                <span class="page-link">Page <span th:text="${currentPage + 1}">1</span> of <span th:text="${auditLogs.totalPages}">1</span></span>
            </li>
            <li class="page-item" th:classappend="${currentPage + 1 >= auditLogs.totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/auditlog(page=${currentPage + 1}, entryType=${selectedEntryType}, operationType=${selectedOperationType})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
